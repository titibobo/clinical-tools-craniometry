<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesure crânienne</title>
<meta name="description" content="Mesure assistée CVAI / indice céphalique sur photos — traitement local, aucune donnée conservée.">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b1f24; --muted:#6b7480; --line:#e2e5ea;
  --accent:#1f6feb; --accent-ink:#ffffff; --ok:#1a7f37; --warn:#b35900; --danger:#c62828;
  --r:8px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --aside:340px; --header:56px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:grid;grid-template-rows:var(--header) 1fr;overflow:hidden}
button,input{font:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- en-tête ---------- */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s4);
  padding:0 var(--s4);background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:650;white-space:nowrap}
nav.tabs{display:flex;gap:var(--s1);justify-self:center}
nav.tabs button{height:36px;padding:0 var(--s4);border:1px solid transparent;border-radius:var(--r);
  background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:var(--s2)}
nav.tabs button.on{background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:600}
nav.tabs .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--line);
  font-size:12px;line-height:20px;text-align:center;color:var(--ink)}
nav.tabs button.on .badge{background:var(--accent);color:var(--accent-ink)}
.hdr-right{display:flex;align-items:center;gap:var(--s3)}
.ref{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--muted)}
.ref input{width:64px;height:32px;padding:0 var(--s2);border:1px solid var(--line);border-radius:6px;text-align:right}

/* ---------- boutons ---------- */
.btn{height:36px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap}
.btn:hover{border-color:#c4c9d1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.active{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}

/* ---------- mise en page ---------- */
main{display:grid;grid-template-columns:var(--aside) minmax(0,1fr);min-height:0;min-width:0}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s5)}
section h2{margin:0 0 var(--s3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:var(--s2);margin-top:var(--s2)}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.cur{border-color:var(--accent)}
.thumb .tag{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font-size:11px;text-align:center;
  background:rgba(0,0,0,.6);color:#fff}
.thumb.ok .tag{background:rgba(26,127,55,.88)}
.thumb.skip{opacity:.45}
.empty{font-size:13px;color:var(--muted);margin:var(--s2) 0 0}

ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:var(--s1)}
ol.steps li{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:var(--s2);font-size:14px;color:var(--muted);height:28px}
ol.steps li .dot{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
ol.steps li.done{color:var(--ink)} ol.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
ol.steps li.now{color:var(--accent);font-weight:600} ol.steps li.now .dot{border-color:var(--accent)}
ol.steps li.na{display:none}

.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}
.tools .btn,.row2 .btn{min-width:0;padding:0 var(--s2);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.manual-only{margin-top:var(--s2)}
.check{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:var(--s2);margin-top:var(--s3);font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;margin:0}
.slider{display:grid;grid-template-columns:auto 1fr 44px;align-items:center;gap:var(--s3);margin-top:var(--s3);font-size:14px}
.slider output{text-align:right}

.result{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);display:grid;gap:var(--s2)}
.kv{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:var(--s3)}
.kv .k{font-size:14px;color:var(--muted)}
.kv .v{font-size:20px;font-weight:650;text-align:right}
.kv .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.note{font-size:12px;color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:var(--s2);margin-top:auto}

/* ---------- zone image ---------- */
.stage{position:relative;min-height:0;background:#20242a;overflow:hidden;touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.banner{position:absolute;top:var(--s3);left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);
  padding:var(--s2) var(--s4);border-radius:20px;background:rgba(15,18,22,.82);color:#fff;font-size:14px;
  text-align:center;pointer-events:none}
.zoom{position:absolute;right:var(--s3);bottom:var(--s3);display:flex;gap:var(--s1)}
.zoom .btn{width:40px;padding:0;background:rgba(255,255,255,.92)}
.zoom .btn.fit{width:auto;padding:0 var(--s3)}
.busy{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:15px}
.busy.on{display:grid}
.drop{position:absolute;inset:0;display:grid;place-items:center;color:#aeb6c1;text-align:center;padding:var(--s5);pointer-events:none}
.drop p{margin:0 0 var(--s2)}

/* ---------- synthèse ---------- */
.summary{grid-column:1 / -1;overflow:auto;padding:var(--s5)}
.summary .wrap{max-width:820px;margin:0 auto;display:grid;gap:var(--s4)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5)}
.card h3{margin:0 0 var(--s3);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 0;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
th.txt,td.txt{text-align:left;padding-left:var(--s3)}
.row2 > table{align-self:start}
tr.mean td{font-weight:700;border-bottom:none;padding-top:10px}
.big{display:grid;grid-template-columns:1fr auto;align-items:baseline}
.big .v{font-size:28px;font-weight:700}
.class{display:inline-block;justify-self:start;margin-top:var(--s2);padding:2px 10px;border-radius:12px;font-size:13px;font-weight:600}
.metric{display:grid;gap:var(--s2);padding:var(--s3) 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:none;padding-top:0}
.mhead{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:var(--s3)}
.mtitle{font-size:14px;font-weight:600}
.mval{font-size:24px;font-weight:700;text-align:right}
.mval small{font-size:14px;font-weight:500;color:var(--muted)}
.msub{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:var(--s3);font-size:12px;color:var(--muted)}
.msub .class{margin:0}
.gauge{margin-top:var(--s1)}
.gauge .bar{position:relative;height:22px;border-radius:4px;overflow:visible}
.gauge .seg{position:absolute;top:0;bottom:0;opacity:.9;display:grid;place-items:center;overflow:hidden;border-right:1px solid #fff}
.gauge .seg:first-child{border-radius:4px 0 0 4px} .gauge .seg:last-of-type{border-radius:0 4px 4px 0;border-right:none}
.gauge .seg span{font-size:11px;font-weight:600;color:#fff;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;padding:0 4px}
.gauge .err{position:absolute;top:calc(100% + 3px);height:3px;background:var(--ink);border-radius:2px;opacity:.55}
.gauge .mark{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);border:1px solid #fff;border-radius:2px}
.gauge .ticks{position:relative;height:16px;margin-top:8px}
.gauge .tick{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:var(--s3) 0 0;line-height:1.5}
.reftab th{text-align:left;vertical-align:top;width:52px;font-size:13px;color:var(--ink)}
.reftab td{text-align:left;vertical-align:top;font-size:13px;padding-right:var(--s3)}
.reftab td:last-child{color:var(--muted);font-size:12px;width:34%;padding-right:0}
.privacy{font-size:12px;color:var(--muted);text-align:center}
.hidden{display:none!important}
.short{display:none}

@media (max-width: 1100px){
  :root{--aside:300px;--header:auto}
  header{grid-template-columns:1fr auto;padding:var(--s2) var(--s3);row-gap:var(--s2)}
  nav.tabs{grid-column:1 / -1;grid-row:2;justify-self:stretch;justify-content:space-between}
  nav.tabs button{padding:0 var(--s2);flex:1;min-width:0;justify-content:center}
}
@media (max-width: 760px){
  .ref span,.long{display:none} .short{display:inline}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto;overflow:auto}
  .stage{grid-row:1} aside{grid-row:2;border-right:none;overflow:visible;padding-bottom:0}
  .actions{position:sticky;bottom:0;background:var(--panel);padding:var(--s3) 0;border-top:1px solid var(--line);margin:0}
  body{overflow:auto}
  .summary{padding:var(--s3)} .summary .row2{grid-template-columns:minmax(0,1fr)} .card{padding:var(--s4)} .mval{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Mesure crânienne</h1>
  <nav class="tabs" id="tabs">
    <button data-v="dessus">Dessus <span class="badge num">0</span></button>
    <button data-v="profil">Profil <span class="badge num">0</span></button>
    <button data-v="face">Face <span class="badge num">0</span></button>
    <button data-v="synthese">Synthèse</button>
  </nav>
  <div class="hdr-right">
    <label class="ref"><span>Référence</span> <input id="refmm" class="num" type="number" min="1" step="0.5" value="50"> mm</label>
    <button class="btn ghost" id="reset" title="Effacer toutes les photos et mesures"><span class="long">Nouvelle séance</span><span class="short">Effacer</span></button>
  </div>
</header>

<main id="main">
  <aside id="aside">
    <section>
      <h2>Photos</h2>
      <div class="row2">
        <label class="btn primary">Prendre une photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
        <label class="btn">Importer…<input id="files" type="file" accept="image/*" multiple hidden></label>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <p class="empty" id="empty">Aucune photo pour cette vue.</p>
    </section>

    <section>
      <h2>Étapes</h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <section>
      <h2>Outils</h2>
      <div class="tools">
        <button class="btn" data-tool="calib">Calibrer</button>
        <button class="btn" data-tool="caliper" id="toolCaliper">Pied à coulisse</button>
        <button class="btn" data-tool="rect" id="toolRect">Détourage auto</button>
        <button class="btn" data-tool="manual" id="toolManual">Contour par points</button>
        <button class="btn" data-tool="point" id="toolPoint">Repointer</button>
      </div>
      <div class="tools manual-only hidden" id="manualBar">
        <button class="btn" id="clearManual">Effacer les points</button>
        <button class="btn primary" id="finishManual">Terminer le contour</button>
      </div>
      <label class="check" id="snapRow"><input type="checkbox" id="snap" checked> Ajuster automatiquement aux bords</label>
      <div class="slider" id="smoothRow">
        <label for="smooth">Lissage</label>
        <input id="smooth" type="range" min="0" max="0.30" step="0.01" value="0.18">
        <output id="smoothOut" class="num">0,18</output>
      </div>
    </section>

    <section>
      <h2>Mesure</h2>
      <div class="result" id="result"><span class="empty">—</span></div>
    </section>

    <div class="actions">
      <button class="btn" id="skip">Ignorer</button>
      <button class="btn primary" id="validate">Valider ⏎</button>
    </div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="drop" id="drop"><div><p>Ajoutez une ou plusieurs photos</p><p style="font-size:13px">Les images restent sur cet appareil et disparaissent à la fermeture de la page.</p></div></div>
    <div class="banner hidden" id="banner"></div>
    <div class="zoom">
      <button class="btn" id="zOut" title="Dézoomer">−</button>
      <button class="btn fit" id="zFit">Ajuster</button>
      <button class="btn" id="zIn" title="Zoomer">+</button>
    </div>
    <div class="busy" id="busy">Détourage…</div>
  </div>

  <div class="summary hidden" id="summary"><div class="wrap" id="sumWrap"></div></div>
</main>

<script id="geom">
"use strict";
/* =====================================================================
   Segmentation (pur JavaScript, sans dépendance)
   ===================================================================== */
const Seg = (() => {
  function toLab(r, g, b) {
    const f = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    let R = f(r), G = f(g), B = f(b);
    let X = (0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047;
    let Y = (0.2126 * R + 0.7152 * G + 0.0722 * B);
    let Z = (0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883;
    const h = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    X = h(X); Y = h(Y); Z = h(Z);
    return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];
  }
  function kmeans(samples, k, iters = 8, init = null) {
    const n = samples.length / 3;
    if (n === 0) return [];
    k = Math.min(k, n);
    let C = init && init.length === k * 3 ? Float64Array.from(init) : new Float64Array(k * 3);
    if (!init || init.length !== k * 3) for (let j = 0; j < k; j++) {
      const i = Math.floor((j + 0.5) * n / k) * 3; C[j*3] = samples[i]; C[j*3+1] = samples[i+1]; C[j*3+2] = samples[i+2];
    }
    const acc = new Float64Array(k * 4);
    for (let it = 0; it < iters; it++) {
      acc.fill(0);
      for (let i = 0; i < n; i++) {
        const a = samples[i*3], b = samples[i*3+1], c = samples[i*3+2];
        let best = 0, bd = Infinity;
        for (let j = 0; j < k; j++) { const d = (a-C[j*3])**2 + (b-C[j*3+1])**2 + (c-C[j*3+2])**2; if (d < bd) { bd = d; best = j; } }
        acc[best*4] += a; acc[best*4+1] += b; acc[best*4+2] += c; acc[best*4+3]++;
      }
      for (let j = 0; j < k; j++) if (acc[j*4+3] > 0) { C[j*3] = acc[j*4]/acc[j*4+3]; C[j*3+1] = acc[j*4+1]/acc[j*4+3]; C[j*3+2] = acc[j*4+2]/acc[j*4+3]; }
    }
    return C;
  }
  function nearest(C, a, b, c) {
    let bd = Infinity;
    for (let j = 0; j < C.length; j += 3) { const d = (a-C[j])**2 + (b-C[j+1])**2 + (c-C[j+2])**2; if (d < bd) bd = d; }
    return Math.sqrt(bd);
  }
  function sample(lab, idxs, max) {
    const step = Math.max(1, Math.floor(idxs.length / max));
    const out = [];
    for (let i = 0; i < idxs.length; i += step) { const p = idxs[i] * 3; out.push(lab[p], lab[p+1], lab[p+2]); }
    return out;
  }
  function boxBlur(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) { let s = 0; const o = y * w;
      for (let x = -r; x <= r; x++) s += src[o + Math.min(w-1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { tmp[o+x] = s / (2*r+1);
        s += src[o + Math.min(w-1, x+r+1)] - src[o + Math.max(0, x-r)]; } }
    for (let x = 0; x < w; x++) { let s = 0;
      for (let y = -r; y <= r; y++) s += tmp[Math.min(h-1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { out[y*w+x] = s / (2*r+1);
        s += tmp[Math.min(h-1, y+r+1) * w + x] - tmp[Math.max(0, y-r) * w + x]; } }
    return out;
  }
  /* rgba: Uint8ClampedArray (w*h*4) ; rect en pixels de travail -> masque Uint8Array */
  function segment(rgba, w, h, rect) {
    const lab = new Float32Array(w * h * 3);
    for (let i = 0; i < w * h; i++) { const L = toLab(rgba[i*4], rgba[i*4+1], rgba[i*4+2]); lab[i*3] = L[0]; lab[i*3+1] = L[1]; lab[i*3+2] = L[2]; }
    let [x0, y0, x1, y1] = rect.map(Math.round);
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(w - 1, x1); y1 = Math.min(h - 1, y1);
    const rw = x1 - x0, rh = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const m = Math.round(0.10 * Math.max(rw, rh));
    const band = [], inner = [], fgSeed = [], inRect = [];
    for (let y = Math.max(0, y0 - m); y <= Math.min(h - 1, y1 + m); y++)
      for (let x = Math.max(0, x0 - m); x <= Math.min(w - 1, x1 + m); x++) {
        const i = y * w + x;
        const inside = x >= x0 && x <= x1 && y >= y0 && y <= y1;
        if (!inside) { band.push(i); continue; }
        inRect.push(i);
        const ex = (x - cx) / (0.30 * rw), ey = (y - cy) / (0.30 * rh);
        if (ex*ex + ey*ey <= 1) fgSeed.push(i);
        if (x - x0 < 0.03*rw || x1 - x < 0.03*rw || y - y0 < 0.03*rh || y1 - y < 0.03*rh) inner.push(i);
      }
    let bgIdx = band.length > 400 ? band : band.concat(inner);
    let Cb = kmeans(sample(lab, bgIdx, 5000), 6);
    let Cf = kmeans(sample(lab, fgSeed, 5000), 6);
    let prob = new Float32Array(w * h);
    for (let pass = 0; pass < 3; pass++) {
      for (const i of inRect) {
        const a = lab[i*3], b = lab[i*3+1], c = lab[i*3+2];
        const dB = nearest(Cb, a, b, c), dF = nearest(Cf, a, b, c);
        prob[i] = dB / (dB + dF + 1e-6);
      }
      if (pass === 2) break;
      const f = [], g = bgIdx.slice();
      for (const i of inRect) (prob[i] > 0.5 ? f : g).push(i);
      Cf = kmeans(sample(lab, f, 6000), 6, 6, Cf);
      Cb = kmeans(sample(lab, g, 6000), 6, 6, Cb);
    }
    const r = Math.max(1, Math.round(0.006 * Math.max(rw, rh)));
    prob = boxBlur(boxBlur(prob, w, h, r), w, h, r);
    const mask = new Uint8Array(w * h);
    for (const i of inRect) mask[i] = prob[i] > 0.5 ? 1 : 0;
    return mask;
  }

  /* ---- morphologie ---- */
  function largestComponent(mask, w, h) {
    const lab = new Int32Array(w * h); let best = 0, bestN = 0, cur = 0;
    const st = new Int32Array(w * h);
    for (let s = 0; s < w * h; s++) {
      if (!mask[s] || lab[s]) continue;
      cur++; let sp = 0, n = 0; st[sp++] = s; lab[s] = cur;
      while (sp) { const i = st[--sp]; n++; const x = i % w, y = (i / w) | 0;
        if (x > 0 && mask[i-1] && !lab[i-1]) { lab[i-1] = cur; st[sp++] = i-1; }
        if (x < w-1 && mask[i+1] && !lab[i+1]) { lab[i+1] = cur; st[sp++] = i+1; }
        if (y > 0 && mask[i-w] && !lab[i-w]) { lab[i-w] = cur; st[sp++] = i-w; }
        if (y < h-1 && mask[i+w] && !lab[i+w]) { lab[i+w] = cur; st[sp++] = i+w; } }
      if (n > bestN) { bestN = n; best = cur; }
    }
    const out = new Uint8Array(w * h);

      prev.forEach((q, i) => { const s = S2(q); i ? ctx.lineTo(...s) : ctx.moveTo(...s); }); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
    }
    ctrl.forEach(q => { const [x, y] = S2(q);
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.manual; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.stroke(); });
  }
  // calibration
  const calib = S.drag?.kind === "handle" && S.drag.h.kind === "calib" ? p.calib.map((q, i) => i === S.drag.h.i ? S.drag.q : q) : p.calib;
  if (calib) { line(calib[0], calib[1], COL.calib, 2); calib.forEach(q => cross(q, COL.calib, 6));
    label([(calib[0][0]+calib[1][0])/2, (calib[0][1]+calib[1][1])/2 - 14 / v.k], `${fmt(refMM(), 1)} mm`, COL.calib); }
  // segments de mesure
  if (p.res && S.tool === "idle" && !(S.drag && S.drag.kind === "handle")) {
    for (const [k, [a, b]] of Object.entries(p.res.seg)) { line(a, b, COL[k], 2); label(b, k === "pied" ? "" : k, COL[k]); }
    p.res.pts.forEach(q => { const [x, y] = S2(q); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill(); });
  }
  if (p.caliper) { const c = S.drag?.kind === "handle" && S.drag.h.kind === "caliper" ? p.caliper.map((q, i) => i === S.drag.h.i ? S.drag.q : q) : p.caliper;
    line(c[0], c[1], COL.pied, 2); c.forEach(q => cross(q, COL.pied, 6)); }
  // point anatomique
  const pt = S.drag?.kind === "handle" && S.drag.h.kind === "point" ? S.drag.q : p.point;
  if (pt && !p.caliper) cross(pt, COL.point, 9);
  // points temporaires
  S.temp.forEach(q => cross(q, S.tool === "calib" ? COL.calib : COL.pied, 6));
  // cadre en cours
  if (S.drag?.kind === "rect") { const A = S2(S.drag.a), B = S2(S.drag.b);
    ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = "#fff"; ctx.strokeRect(A[0], A[1], B[0]-A[0], B[1]-A[1]); ctx.setLineDash([]); }
  else if (p.rect && S.tool === "rect") { const A = S2([p.rect[0], p.rect[1]]), B = S2([p.rect[2], p.rect[3]]);
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(A[0], A[1], B[0]-A[0], B[1]-A[1]); ctx.setLineDash([]); }
  // point en cours de placement + loupe
  const D = S.drag;
  if (D && (D.kind === "place" || D.kind === "handle" || D.kind === "manual")) {
    const col = D.kind === "handle" ? COL[{ point: "point", calib: "calib", caliper: "pied", ctrl: "manual" }[D.h.kind]]
              : S.tool === "calib" ? COL.calib : S.tool === "point" ? COL.point : S.tool === "manual" ? COL.manual : COL.pied;
    cross(D.q, col, 7);
    loupe(p, D.q, col);
  }
}

function loupe(p, q, col) {
  const [W] = canvasSize(), R = 72, Z = Math.max(3 * p.viewT.k, 1.5);
  const s = toScr(p, q);
  const cx = s[0] < W / 2 && s[1] < 220 ? W - R - 16 : R + 16, cy = R + 60;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
  ctx.fillStyle = "#000"; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  ctx.imageSmoothingEnabled = Z < 6;
  ctx.drawImage(p.img, cx - q[0] * Z, cy - q[1] * Z, p.w * Z, p.h * Z);
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = col; ctx.beginPath();
  ctx.moveTo(cx - R, cy); ctx.lineTo(cx - 5, cy); ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + R, cy);
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy - 5); ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + R); ctx.stroke();
}

/* =====================================================================
   Synthèse
   ===================================================================== */
function stats(a) { const n = a.length; if (!n) return null; const m = a.reduce((s, x) => s + x, 0) / n;
  const sd = n > 1 ? Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (n - 1)) : 0; return { m, sd, n }; }
function computeSummary() {
  const ok = v => S.photos[v].filter(p => p.status === "ok");
  const D = ok("dessus"), P = ok("profil"), F = ok("face");
  const out = { D, P, F,
    cvai: stats(D.map(p => p.val.CVAI)), ic2d: stats(D.map(p => p.val.IC2D)),
    cva: stats(D.filter(p => p.val.CVA != null).map(p => p.val.CVA)),
    L: stats(P.filter(p => p.val.L != null).map(p => p.val.L)),
    W: stats(F.filter(p => p.val.W != null).map(p => p.val.W)) };
  if (out.L && out.W) { const ic = 100 * out.W.m / out.L.m;
    out.ic = { m: ic, sd: ic * Math.hypot(out.W.sd / out.W.m, out.L.sd / out.L.m) }; }
  return out;
}
const pm = (s, d) => `${fmt(s.m, d)} ± ${fmt(s.sd, d)}`;
/* jauge horizontale : bandes de sévérité + marqueur de la valeur */
function gauge(key, v, sd) {
  const B = Geo.BANDS[key], span = B.max - B.min, pos = x => Math.min(100, Math.max(0, 100 * (x - B.min) / span));
  let lo = B.min, segs = "", ticks = "";
  B.b.forEach(([hi, lab, col], i) => {
    segs += `<div class="seg" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%;background:${col}"><span>${lab}</span></div>`;
    if (i < B.b.length - 1) ticks += `<span class="tick num" style="left:${pos(hi)}%">${fmt(hi, hi % 1 ? 2 : 0)}</span>`;
    lo = hi;
  });
  const err = sd ? `<div class="err" style="left:${pos(v - sd)}%;width:${pos(v + sd) - pos(v - sd)}%"></div>` : "";
  return `<div class="gauge"><div class="bar">${segs}${err}<div class="mark" style="left:${pos(v)}%"></div></div><div class="ticks">${ticks}</div></div>`;
}
function metric(title, key, s, d, sub) {
  const [lab, col] = Geo.classify(key, s.m);
  return `<div class="metric">
    <div class="mhead"><span class="mtitle">${title}</span><span class="mval num">${pm(s, d)} <small>${Geo.BANDS[key].unit}</small></span></div>
    <div class="msub"><span class="class" style="background:${col}1f;color:${col}">${key === "CVAI" ? Geo.cvaiClass(s.m)[0] : lab}</span><span>${sub || ""}</span></div>
    ${gauge(key, s.m, s.sd)}</div>`;
}
function renderSummary() {
  const R = computeSummary(), cards = [];
  // Interprétation
  if (R.cvai || R.ic || R.ic2d) {
    const icRef = R.ic || R.ic2d;
    let m = "";
    if (R.cvai) m += metric("CVAI — asymétrie (plagiocéphalie)", "CVAI", R.cvai, 2, `vue de dessus, n = ${R.cvai.n}`);
    if (R.cva) m += metric("CVA — différence des diagonales", "CVA", R.cva, 1, `vue de dessus calibrée, n = ${R.cva.n}`);
    if (icRef) m += metric("IC — proportion largeur / longueur (brachycéphalie)", "IC", icRef, 1,
      R.ic ? "IC orthogonal (face + profil)" : "IC de la vue de dessus, faute de face + profil");
    let note = "";
    if (R.ic && R.ic2d) note = `<p class="fine">IC vue de dessus : <span class="num">${pm(R.ic2d, 1)} %</span> — écart avec l'IC orthogonal : <span class="num">${fmt(R.ic2d.m - R.ic.m, 1)}</span> point(s). Un écart important suggère une photo de dessus inclinée ou des cheveux qui élargissent le contour.</p>`;
    cards.push(`<div class="card"><h3>Interprétation</h3>${m}${note}</div>`);
  }
  // Détail des clichés
  if (R.cvai) {
    cards.push(`<div class="card"><h3>Vue de dessus — détail</h3>
      <table><tr><th>Photo</th><th class="txt">Contour</th><th>CVAI (%)</th><th>IC dessus (%)</th><th>CVA (mm)</th></tr>
      ${R.D.map((p, i) => `<tr><td>${i+1}</td><td class="txt">${p.contourSrc === "manual" ? "par points" : "auto"}</td><td class="num">${fmt(p.val.CVAI, 2)}</td><td class="num">${fmt(p.val.IC2D, 1)}</td><td class="num">${fmt(p.val.CVA, 1)}</td></tr>`).join("")}
      <tr class="mean"><td>Moyenne ± ET</td><td></td><td class="num">${pm(R.cvai, 2)}</td><td class="num">${pm(R.ic2d, 1)}</td><td class="num">${R.cva ? pm(R.cva, 1) : "—"}</td></tr></table></div>`);
  }
  if (R.L || R.W) {
    const rows = (lst, key) => lst.map((p, i) => `<tr><td>${i+1}</td><td class="txt">${p.res.manuel ? "pied à coulisse" : "auto"}</td><td class="num">${fmt(p.val[key], 1)}</td></tr>`).join("");
    cards.push(`<div class="card"><h3>Profil et face — détail</h3>
      <div class="row2" style="gap:24px">
        <table><tr><th>Profil</th><th class="txt">Mesure</th><th>Longueur AP (mm)</th></tr>${rows(R.P.filter(p => p.val.L != null), "L")}
          ${R.L ? `<tr class="mean"><td>Moyenne ± ET</td><td></td><td class="num">${pm(R.L, 1)}</td></tr>` : ""}</table>
        <table><tr><th>Face</th><th class="txt">Mesure</th><th>Largeur (mm)</th></tr>${rows(R.F.filter(p => p.val.W != null), "W")}
          ${R.W ? `<tr class="mean"><td>Moyenne ± ET</td><td></td><td class="num">${pm(R.W, 1)}</td></tr>` : ""}</table>
      </div>
      ${R.ic ? "" : `<p class="fine">L'IC orthogonal apparaît dès qu'il y a au moins une photo de profil et une de face validées et calibrées.</p>`}</div>`);
  }
  if (!cards.length) cards.push(`<div class="card"><p class="empty" style="margin:0">Aucune mesure validée pour l'instant.</p></div>`);
  else cards.push(`<div style="display:flex;justify-content:flex-end"><button class="btn primary" id="copy">Copier le résumé</button></div>`);
  // Références
  const B = Geo.BANDS;
  cards.push(`<div class="card refs"><h3>Valeurs de référence</h3>
    <table class="reftab">
      <tr><th>CVAI</th><td>&lt; 3,5 % normal · 3,5–6,25 léger · 6,25–8,75 modéré · 8,75–11 sévère · ≥ 11 très sévère</td><td>${B.CVAI.src}</td></tr>
      <tr><th>CVA</th><td>&lt; 3 mm physiologique · 3–12 mm léger à modéré · &gt; 12 mm sévère</td><td>${B.CVA.src}</td></tr>
      <tr><th>IC</th><td>75–85 % normal · ≥ 90 % brachycéphalie (90–93 légère · 93–97 modérée · &gt; 97 sévère) · &lt; 75 % dolichocéphalie</td><td>${B.IC.src}</td></tr>
    </table>
    <p class="fine">Les seuils de brachycéphalie varient beaucoup selon les auteurs (de ≥ 80 % à ≥ 97 %) ; la zone 85–90 % est donc indiquée comme intermédiaire. Ces normes ont été établies au pied à coulisse ou par scanner 3D (euryon–euryon / glabelle–opisthocranion) : l'IC orthogonal s'en rapproche davantage que l'IC de la vue de dessus. Repères d'aide à l'analyse, à interpréter avec l'âge et la clinique.</p></div>`);
  cards.push(`<p class="privacy">Traitement entièrement local : aucune image ni mesure n'est envoyée ni conservée. Tout est effacé à la fermeture de la page.</p>`);
  $("sumWrap").innerHTML = cards.join("");
  const c = $("copy"); if (c) c.onclick = async () => {
    try { await navigator.clipboard.writeText(summaryText(R)); c.textContent = "Copié ✓"; setTimeout(() => c.textContent = "Copier le résumé", 1500); }
    catch (e) { prompt("Copier le texte :", summaryText(R)); }
  };
}
function summaryText(R) {
  const L = [`Mesure crânienne — ${new Date().toLocaleDateString("fr-FR")}`];
  if (R.cvai) L.push(`CVAI ${pm(R.cvai, 2)} % (n=${R.cvai.n}) — ${Geo.cvaiClass(R.cvai.m)[0]} [normal < 3,5 %]`);
  if (R.cva) L.push(`CVA ${pm(R.cva, 1)} mm — ${Geo.classify("CVA", R.cva.m)[0].toLowerCase()} [physiologique < 3 mm]`);
  if (R.ic) L.push(`IC orthogonal ${pm(R.ic, 1)} % — ${Geo.classify("IC", R.ic.m)[0].toLowerCase()} [normal 75–85 %, brachycéphalie ≥ 90 %]`);
  if (R.ic2d) L.push(`IC vue de dessus ${pm(R.ic2d, 1)} %`);
  if (R.L) L.push(`Longueur AP ${pm(R.L, 1)} mm (n=${R.L.n}) ; ` + (R.W ? `largeur ${pm(R.W, 1)} mm (n=${R.W.n})` : ""));
  else if (R.W) L.push(`Largeur ${pm(R.W, 1)} mm (n=${R.W.n})`);
  return L.join("\n");
}

render();
window.__crane = { S, render, cur };   // pour les tests
})();
</script>
